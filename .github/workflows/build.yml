name: Compilation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Déterminer la version
        id: version
        shell: pwsh
        run: |
          $v = "1.0.${{ github.run_number }}"
          "value=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version : $v"

      - name: Compiler l'application
        run: >
          dotnet publish src/DayZServerManager/DayZServerManager.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      - name: Mettre l'exe à disposition
        uses: actions/upload-artifact@v4
        with:
          name: DayZServerManager-${{ steps.version.outputs.value }}
          path: publish/DayZServerManager.exe

      - name: Publier la nouvelle version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "src/notes-de-version.md"
          if (-not (Test-Path $notes)) { Set-Content -Path $notes -Value "Mise à jour." -Encoding utf8 }
          $v = "${{ steps.version.outputs.value }}"
          gh release create "v$v" publish/DayZServerManager.exe --title "Version $v" --notes-file $notes --latest
